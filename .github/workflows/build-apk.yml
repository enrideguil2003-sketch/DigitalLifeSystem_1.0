name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Locate Gradle project
        run: |
          GW=$(find . -maxdepth 3 -name gradlew | head -n 1)
          if [ -z "$GW" ]; then echo "gradlew not found - upload the project files to the repository root"; ls -R | head -50; exit 1; fi
          PROJ=$(dirname "$GW")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJ"

      - name: Remove machine-specific local.properties
        run: rm -f "$PROJ/local.properties"

      - name: Restore signing key from text file
        run: |
          cd "$PROJ"
          if [ ! -f androidApp/dls.keystore ]; then
            base64 -d androidApp/dls.keystore.b64 > androidApp/dls.keystore
          fi
          keytool -list -keystore androidApp/dls.keystore -storepass digitallife | head -n 5

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build signed release APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=1000"
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            if ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace $OPTS; then exit 0; fi
            echo "Attempt $i failed, waiting 30s..."; sleep 30
          done
          exit 1

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find "$PROJ/androidApp/build/outputs/apk/release" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; find "$PROJ/androidApp/build" -name "*.apk"; exit 1; fi
          cp "$APK" dist/DigitalLifeSystem.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: DigitalLifeSystem-apk
          path: dist/DigitalLifeSystem.apk
